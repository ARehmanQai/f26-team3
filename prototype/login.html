<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <nav class="navbar navbar-expand-lg bg-ec-light-blue">
        <div class="container-fluid d-flex">
            <a class="navbar-brand link-light fw-bold" href="home.html">
                <img src="resources/logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">

                    <li class="nav-item">
                        <a class="nav-link nav-button" aria-current="page" href="#"> <i
                                class="bi bi-search text-white"></i> Browse Provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Become a provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="signup.html">Sign Up</a>
                    </li>

                    <li class="nav-item ms-3">
                        <form class="d-flex" role="search">
                            <input class="form-control nav-search" type="search" placeholder="Search providers..."
                                aria-label="Search providers">
                            <button class="btn nav-button ms-2" type="submit"> Search </button>
                        </form>
                    </li>


                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="login-container">

            <h1 class="text-center">
                Welcome Back to Event Crew
            </h1>

            <p class="text-center text-muted">
                Sign in to your account to manage your events
            </p>

            <form>

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input type="email" class="form-control" id="email" placeholder="you@example.com" required>

                </div>

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password" class="form-control" id="password" required>
                </div>


                <a href="customer/dashboard.html" class="btn login-button w-100">

                    Sign In as Customer

                </a>

                <p class="text-center mt-4">

                    Are you a provider?

                    <a href="provider/login.html">
                        Sign in here

                    </a>
                </p>

            </form>

            <p class="text-center mt-4">

                Don't have an account?

                <a href="signup.html">
                    Sign up here
                </a>

            </p>

        </div>

    </div>



</body>

<footer class="text-white bg-ec-light-blue py-4 mt-5">
    <div class="container-fluid">
        <div class="row px-3 align-items-center justify-content-center text-center gap-lg-0 gap-3">
            <a class="navbar-brand link-light fw-bold col-lg-2 col-10" href="home.html">
                <img src="resources/logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <p class="mb-0 ec-dark-blue text-center col-lg-8 col-10">© 2026 Event Crew Limited.</p>
            <ul class="list-unstyled d-flex col-lg-2 col-10 gap-3 mb-0 justify-content-center">
                <li>
                    <a href="#">
                        <i class="bi bi-tiktok"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-instagram"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-linkedin"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-facebook"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-pinterest"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                </li>
            </ul>

        </div>
    </div>
</footer>

</html>
