<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider - Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-ec-light-blue">
        <div class="container-fluid d-flex">
            <a class="navbar-brand link-light fw-bold" href="../home.html">
                <img src="../resources/logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">

                    <li class="nav-item">
                        <a class="nav-link nav-button" aria-current="page" href="#"> Browse Provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Become a provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="signup.html">Sign Up</a>
                    </li>

                    <li class="nav-item ms-3">
                        <form class="d-flex" role="search">
                            <input class="form-control nav-search" type="search" placeholder="Search providers..."
                                aria-label="Search providers">
                            <button class="btn nav-button ms-2" type="submit"> Search </button>
                        </form>
                    </li>


                </ul>
            </div>
        </div>
    </nav>

    <div class="container-fluid form-container">
        <div class="row justify-content-end align-items-center px-5" style="height: 100vh;">
            <div class="pr-signup-container col-5">
                <h2 class="signup-title mb-2">Welcome Back to Event Crew</h2>
                <h4 class="mb-1">Log back into your Provider account</h4>
                <hr>
                <form action="customer/dashboard.html">
                    <div class="mb-3">
                        <label for="name" class="form-label">Username:</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your Username" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password:</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter Your Password" required>
                    </div>

                    <div class="container-fluid text-center">
                        <button type="submit" class="btn signup-button w-50">Log In</button>
                    </div>

                </form>

                <p class="text-center mt-4 mb-1">
                    Create an account?
                    <a href="signup.html">Sign Up</a>
                </p>

                <p class="text-center mb-0 ">
                    Are you a regular user?
                    <a href="../signup.html">Sign up here</a>
                </p>


            </div>
        </div>
    </div>

</body>

<footer class="text-white bg-ec-light-blue py-4">
    <div class="container-fluid">
        <div class="row px-3 align-items-center justify-content-center text-center gap-lg-0 gap-3">
            <a class="navbar-brand link-light fw-bold col-lg-2 col-10" href="home.html">
                <img src="../resources/logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <p class="mb-0 ec-dark-blue text-center col-lg-8 col-10">© 2026 Event Crew Limited.</p>

                    <a href="#">
                        <i class="bi bi-tiktok"></i>
                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-instagram"></i>
                    </a>
                </li>

                <li>
                    <a href="#">

                </li>

                <li>
                    <a href="#">

                    </a>
                </li>

                <li>
                    <a href="#">

                    </a>
                </li>

                <li>
                    <a href="#">
                        <i class="bi bi-twitter-x"></i>
                    </a>
                </li>
            </ul>

        </div>
    </div>
</footer>

</html>

<script>
    const companyRadio = document.getElementById("provider-company");
    const independentRadio = document.getElementById("independent-provider");
    const nameInput = document.getElementById("name");

    companyRadio.addEventListener("change", function () {
        nameInput.placeholder = "Enter Company Name as Registered";
    });

    independentRadio.addEventListener("change", function () {
        nameInput.placeholder = "Enter Full Name";
    });
</script>
