    <div class="container-fluid form-container">
        <div class="row justify-content-end align-items-center px-5">
            <div class="pr-signup-container col-lg-5 col-10">
                <h1 class="signup-title">Event Crew</h1>
                <h2 class="mb-1">Sign Up as a Provider</h2>
                <hr>
                <form action="login.html">
                    <div class="mb-3">
                        <label class="form-label d-block">Are you a provider company or independent provider?</label>

                        <div class="d-flex gap-4 row">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="provider_type" id="provider-company"
                                    value="company" required>
                                <label class="form-check-label" for="provider-company">
                                    Provider Company
                                </label>
                            </div>

                            <div class="form-check">
                                <input class="form-check-input" type="radio" name="provider_type"
                                    id="independent-provider" value="independent">
                                <label class="form-check-label" for="independent-provider">
                                    Independent Provider
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="name" class="form-label">Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter Name" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="abc@gmail.com"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="service" class="form-label">Service Type</label>
                        <select class="form-select" id="service" name="service" required>
                            <option value="" selected disabled>Select a service</option>
                            <option value="catering">Catering</option>
                            <option value="photography">Photography</option>
                            <option value="dj">DJ / Music</option>
                            <option value="decoration">Event Decoration</option>
                            <option value="security">Security</option>
                            <option value="venue">Venue</option>
                            <option value="other">Other</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" id="phone" name="phone" placeholder="Enter phone number"
                            required>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Service Area</label>
                        <input type="text" class="form-control" id="location" name="location"
                            placeholder="e.g. Greensboro, NC" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password"
                            placeholder="Enter Password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirm-password" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirm-password" name="confirm-password"
                            placeholder="Enter Password Again to Confirm" required>
                    </div>

                    <button type="submit" class="btn signup-button w-100">Create Account</button>

                </form>

                <p class="text-center mt-3">
                    Already have an account?
                    <a href="login.html">Log In</a>
                </p>

                <p class="text-center">
                    Are you a regular user?
                    <a href="../signup.html">Sign up here</a>
                </p>


            </div>
        </div>
    </div>

</body>

<script>
    const companyRadio = document.getElementById("provider-company");
    const independentRadio = document.getElementById("independent-provider");
    const nameInput = document.getElementById("name");

    companyRadio.addEventListener("change", function () {
        nameInput.placeholder = "Enter Company Name as Registered";
    });

    independentRadio.addEventListener("change", function () {
        nameInput.placeholder = "Enter Full Name";
    });
</script>
