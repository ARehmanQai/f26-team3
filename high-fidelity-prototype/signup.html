    <div class="container">

    <div class="signup-container">
        <h1 class="signup-title">Event Crew</h1>
        <h2>Create Your Customer Account.</h2>

        <form action = "customer/dashboard.html">

            <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="name" name="name" required>
            </div>

            <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" name="email" required>
            </div>

            <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" name="password" required>
            </div>

            <div class="mb-3">
            <label for="confirm-password" class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirm-password" name="confirm-password" required>
            </div>

            <button type="submit" class="btn signup-button w-100">Create Account</button>

     </form>

      <p class="text-center mt-3">
                Already have an account?
                <a href="login.html">Log In</a>
      </p>

      <p class="text-center">
                Are you a provider?
                <a href="provider/register.html">Sign up as a provider</a>
     </p>        


    </div>
