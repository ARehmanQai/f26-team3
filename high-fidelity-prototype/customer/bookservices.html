     <div class="container mt-5 profile-header">
    <h1 class="text-center">Book a Service</h1>
    <p class="text-center"> Complete the information below to book your selected service. </p>
    </div>

    <div class="container mt-4">
    <form class="profile-container">
        <div class="mb-3">
            <label for="fullName" class="form-label"> Service </label>
            <input type="text" class="form-control" id="service" placeholder="Selected Service">
    </div>


    <div class="mb-3">
        <label for="provider" class="form-label"> Provider </label>
        <input type="text" class="form-control" id="provider" placeholder="Placeholder" >
    </div>

    <div class="mb-3">
        <label for="eventDate" class="form-label"> Event Date </label>
        <input type="date" class="form-control" id="eventDate" placeholder="Placeholder" >
    </div>

    <div class="mb-3">
    <label for="addDetails" class="form-label"> Additional Details </label>
    <textarea class="form-control" id="addDetails" rows="4" placeholder="Add any details about your event."></textarea>
</div>


    <a href="bookings.html" class="btn event-button"> Confirm your booking </a>

    </form>
