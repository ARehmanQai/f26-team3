<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Started</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <div class="navbar-nav d-flex flex-row gap-5">
            <a class="nav-link text-white" href="../home.html">Home</a>
           
            <a class="nav-link text-white" href="../signup.html">Get Started</a>
            <a class="nav-link text-white" href="../login.html">Login</a>

        </div>
        </div>
        </nav>


        <div class="container my-5">

        <div class="card shadow-sm mx-auto" style="max-width: 650px;">

            <div class="card-body p-4">

                <h1 class="text-center mb-3">
                    Let's Get Started!
                </h1>

                <p class="text-center text-muted mb-4">
                    Tell us a little about your event needs.
                </p>

        <form>

            <h5 class="mb-3">
                What are you looking to hire?
                </h5>


                <div class="form-check">

                    <input class="form-check-input" type="radio" name="hire-type" id="crew"required>
                    <label class="form-check-label" for="crew"> Event Crew </label>
                </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="hire-type" id="helper">
                        <label class="form-check-label" for="helper"> Individual Helper </label>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="radio" name="hire-type" id="either">
                        <label class="form-check-label" for="either"> Undecided </label>
                    </div>

        <div class="mb-4">

            <label for="event-type" class="form-label fw-bold"> What type of event are you planning? </label>
            <select class="form-select" id="event-type" required> <option value=""> Please select an event type </option>

                <option> Wedding </option>
                <option> Birthday or Private Party </option>
                <option> Corporate Event </option>
                <option> Concert or Festival </option>
                <option> Other </option>

                    </select>

                    </div>

        <div class="mb-4">

            <label for="event-date" class="form-label fw-bold"> When is your event? </label> 
            <input type="date" class="form-control" id="event-date">

        </div>


    <div class="mb-3">
        <label for="services" class="form-label"> What services are you looking for? </label>
        <textarea class="form-control" id="services" rows="4" placeholder="Tell us what services you need, such as event setup, catering, photography, cleanup, DJ/music, or decorations.">
        </textarea>
    </div>









</body>
</html>
