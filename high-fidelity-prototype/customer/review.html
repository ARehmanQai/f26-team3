                <img src="logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">



                    <li class="nav-item">
                        <a class="nav-link nav-button" aria-current="page" href="#"> <i class="bi bi-search text-white"></i> Browse Provider</a>
                    </li>
                    <li class="nav-item">

                    </li>

                    <li class="nav-item">

    <div class = "container mt-5">

    </div>

    <div class="container mt-4">
        <div class="card mx-auto" style="max-width: 650px;">
            <div class="card-body p-4">
                <h2 class= "card-title"> Your review for Placeholder</h2>
                <form>
                     <div class="mb-3">
                        <label for="rating" class="form-label">
                            Rating (1-5)
                        </label>
                        <input type="number" class = "form-control" id="rating" min="1" max="5" placeholder="Enter a rating from 1 to 5.">
                        </div>

                        <div class="mb-3">
                        <label for="review" class="form-label"> Your Review </label>

                        <textarea class = "form-control" id="review" rows="5" placeholder="Share your experience"></textarea>
                            </div>

                    <a href ="bookings.html" class = "btn bg-ec-dark-blue text-white"> Submit Review </a>

                    </form>
                    </div>
                    </div>
                    </div>
