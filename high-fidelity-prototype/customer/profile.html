<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>


<body>

    <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <div class="navbar-nav d-flex flex-row gap-5">
            <a class="nav-link text-white" href="../home.html">Home</a>
           
            <a class="nav-link text-white" href="../signup.html">Get Started</a>
            <a class="nav-link text-white" href="../login.html">Login</a>

        </div>
        </div>
        </nav>


    <div class="container mt-5">
    <h1 class="text-center">Manage Your Profile</h1>
    <p class="text-center"> Update your account information. </p>
    </div>

    <div class="container mt-4">
    <form>
        <div class="mb-3">
            <label for="fullName" class="form-label"> Change Your Full Name </label>
            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
    </div>


    <div class="mb-3">
        <label for="email" class="form-label"> Change Your Email Address </label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" >
    </div>

    <div class="mb-3">
        <label for="newPassword" class="form-label"> Change Your Password </label>
        <input type="password" class="form-control" id="newPassword" placeholder="Enter your password" >
    </div>

    </form>

    





</body>
</html>
