<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Profile</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../styles.css">
</head>


<body>

    <nav class="navbar navbar-expand-lg bg-ec-dark-blue">
        <div class="container-fluid d-flex">
            <a class="navbar-brand link-light fw-bold" href="home.html">
                <img src="logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">



                    <li class="nav-item">
                        <a class="nav-link nav-button" aria-current="page" href="#"> <i class="bi bi-search text-white"></i> Browse Provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Become a provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="signup.html">Sign Up</a>
                    </li>

                    <li class="nav-item ms-3">
                        <form class="d-flex" role="search">
                        <input class="form-control nav-search" type="search" placeholder="Search providers..." aria-label="Search providers">
                        <button class="btn nav-button ms-2" type="submit"> Search </button>
                    </form>
                    </li>


                </ul>
            </div>
        </div>
    </nav>


    <div class="container mt-5">
    <h1 class="text-center">Manage Your Profile</h1>
    <p class="text-center"> Update your account information. </p>
    </div>

    <div class="container mt-4">
    <form>
        <div class="mb-3">
            <label for="fullName" class="form-label"> Change Your Full Name </label>
            <input type="text" class="form-control" id="fullName" placeholder="Enter your full name">
    </div>


    <div class="mb-3">
        <label for="email" class="form-label"> Change Your Email Address </label>
        <input type="email" class="form-control" id="email" placeholder="Enter your email" >
    </div>

    <div class="mb-3">
        <label for="newPassword" class="form-label"> Change Your Password </label>
        <input type="password" class="form-control" id="newPassword" placeholder="Enter your password" >
    </div>

    <div class="mb-3">
    <label for="confirmPassword" class="form-label"> Confirm New Password </label>
    <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your new password">
</div>

    <hr class="my-4">
    <h2> Event Preferences </h2>
    <p> Update your event type. </p>

    <div class="mb-3">
    <label for="eventType" class="form-label"> What type of event are you planning? </label>
    <select class="form-select" id="eventType">
        <option selected> Select an event type </option>
        <option> Wedding </option>
        <option> Birthday or Private Party </option>
        <option> Corporate Event </option>
        <option> Festival or Concert </option>
        <option> Other </option>
    </select>
    </div>

    <div class="mb-3">
    <label for="eventDate" class="form-label"> When is your event? </label>
    <input type="date" class="form-control" id="eventDate">
    </div>

    <div class="mb-3">
    <label for="services" class="form-label"> What services are you looking for? </label>
    <textarea class="form-control" id="services" rows="4" placeholder="Describe the services you need..."></textarea>
    </div>

    <button type="submit" class="btn btn-dark"> Save Changes </button>

    </form>

    





</body>
</html>
