<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    
     <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">

        <div class="navbar-nav d-flex flex-row gap-5">
            <a class="nav-link text-white" href="home.html">Home</a>
           
            <a class="nav-link text-white" href="signup.html">Get Started</a>
            <a class="nav-link text-white" href="login.html">Login</a>

        </div>
        </div>
        </nav>

        <div class="container">
        <div class="login-container">

            <h1 class="text-center">
                Welcome Back to Event Crew
            </h1>

            <p class="text-center text-muted">
                Sign in to your account to manage your events
            </p>

             <form>

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="you@example.com"
                        required>

                </div>

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password" class="form-control" id="password" required>
                </div>


                 <a
                    href="customer/gettingstarted.html"
                    class="btn btn-dark w-100">

                    Sign In as Customer

                </a>

                <a
                    href="provider/login.html"
                    class="btn btn-outline-dark w-100 mt-3">

                    Sign In as Provider

                </a>

            </form>

            <p class="text-center mt-4">

                Don't have an account?

                <a href="signup.html">
                    Sign up here
                </a>

            </p>

        </div>

    </div>








</body>
</html>
