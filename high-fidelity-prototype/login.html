<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">

</head>

<body>
    
    <nav class="navbar navbar-expand-lg bg-ec-dark-blue">
        <div class="container-fluid d-flex">
            <a class="navbar-brand link-light fw-bold" href="home.html">
                <img src="logo.png" alt="Event Crew Logo" width="75" height="34">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto ">



                    <li class="nav-item">
                        <a class="nav-link nav-button" aria-current="page" href="#"> <i class="bi bi-search text-white"></i> Browse Provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Become a provider</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="#">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-button" href="signup.html">Sign Up</a>
                    </li>

                    <li class="nav-item ms-3">
                        <form class="d-flex" role="search">
                        <input class="form-control nav-search" type="search" placeholder="Search providers..." aria-label="Search providers">
                        <button class="btn nav-button ms-2" type="submit"> Search </button>
                    </form>
                    </li>


                </ul>
            </div>
        </div>
    </nav>

        <div class="container">
        <div class="login-container">

            <h1 class="text-center">
                Welcome Back to Event Crew
            </h1>

            <p class="text-center text-muted">
                Sign in to your account to manage your events
            </p>

             <form>

                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        placeholder="you@example.com"
                        required>

                </div>

                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input type="password" class="form-control" id="password" required>
                </div>


                 <a
                    href="customer/dashboard.html"
                    class="btn btn-dark w-100">

                    Sign In as Customer

                </a>

                <a
                    href="provider/login.html"
                    class="btn btn-outline-dark w-100 mt-3">

                    Sign In as Provider

                </a>

            </form>

            <p class="text-center mt-4">

                Don't have an account?

                <a href="signup.html">
                    Sign up here
                </a>

            </p>

        </div>

    </div>








</body>
</html>
